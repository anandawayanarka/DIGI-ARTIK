<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIGI-ARTIK - Test Profile API</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f9;padding:24px}
.card{max-width:700px;margin:30px auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.08)}
h2{margin-top:0}
input{width:100%;box-sizing:border-box;padding:12px;margin:6px 0 12px;border:1px solid #ccd3da;border-radius:9px}
button{padding:11px 15px;margin:5px 5px 5px 0;border:0;border-radius:9px;background:#0d6efd;color:#fff;cursor:pointer}
button.secondary{background:#6c757d}
pre{background:#f7f8fa;padding:15px;border-radius:10px;white-space:pre-wrap;word-break:break-word}
.status{font-size:13px;color:#666;margin-bottom:16px}
</style>
</head>
<body>
<div class="card">
  <h2>👤 DIGI-ARTIK PROFILE API TEST</h2>
  <div class="status">
    API aktif:<br>https://script.google.com/macros/s/AKfycbxogSuxCyoug_utx-haU7LfnFMY62cdxLxSbDpNYyG0Of71mqUfYGvs4wJQZ64gicX21w/exec
  </div>

  <label>NIP</label>
  <input id="nip" placeholder="Masukkan NIP">

  <label>Password</label>
  <input id="password" type="password" placeholder="Masukkan password">

  <button onclick="login()">🔑 LOGIN</button>
  <button class="secondary" onclick="getProfile()">👤 GET PROFILE</button>
  <button class="secondary" onclick="checkSession()">🔎 CHECK SESSION</button>
  <button class="secondary" onclick="logout()">🚪 LOGOUT</button>

  <pre id="hasil">Belum ada hasil...</pre>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxogSuxCyoug_utx-haU7LfnFMY62cdxLxSbDpNYyG0Of71mqUfYGvs4wJQZ64gicX21w/exec";
let token = localStorage.getItem("DIGI_ARTIK_TOKEN") || "";

async function api(body) {
  const response = await fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify(body)
  });

  const raw = await response.text();

  try {
    return JSON.parse(raw);
  } catch (e) {
    throw new Error("Respons API bukan JSON. HTTP " + response.status + ": " + raw.substring(0, 500));
  }
}

async function login() {
  const hasil = document.getElementById("hasil");
  try {
    hasil.textContent = "⏳ Login...";
    const data = await api({
      action: "login",
      nip: document.getElementById("nip").value.trim(),
      password: document.getElementById("password").value
    });

    if (data.success && data.token) {
      token = data.token;
      localStorage.setItem("DIGI_ARTIK_TOKEN", token);
    }

    hasil.textContent = JSON.stringify(data, null, 2);
  } catch (e) {
    hasil.textContent = "❌ LOGIN ERROR\n\n" + e.message;
  }
}

async function getProfile() {
  const hasil = document.getElementById("hasil");

  if (!token) {
    hasil.textContent = "⚠️ Token belum ada. Silakan LOGIN dahulu.";
    return;
  }

  try {
    hasil.textContent = "⏳ Mengambil profile...";
    const data = await api({
      action: "getProfile",
      token: token
    });

    hasil.textContent = JSON.stringify(data, null, 2);
  } catch (e) {
    hasil.textContent = "❌ GET PROFILE ERROR\n\n" + e.message;
  }
}

async function checkSession() {
  const hasil = document.getElementById("hasil");

  if (!token) {
    hasil.textContent = "⚠️ Token belum ada. Silakan LOGIN dahulu.";
    return;
  }

  try {
    hasil.textContent = "⏳ Mengecek session...";
    const data = await api({
      action: "checkSession",
      token: token
    });

    hasil.textContent = JSON.stringify(data, null, 2);
  } catch (e) {
    hasil.textContent = "❌ CHECK SESSION ERROR\n\n" + e.message;
  }
}

async function logout() {
  const hasil = document.getElementById("hasil");

  if (!token) {
    hasil.textContent = "⚠️ Token belum ada.";
    return;
  }

  try {
    hasil.textContent = "⏳ Logout...";
    const data = await api({
      action: "logout",
      token: token
    });

    token = "";
    localStorage.removeItem("DIGI_ARTIK_TOKEN");

    hasil.textContent = JSON.stringify(data, null, 2);
  } catch (e) {
    hasil.textContent = "❌ LOGOUT ERROR\n\n" + e.message;
  }
}
</script>
</body>
</html>
