<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test DIGI-ARTIK Session</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f7fa;padding:25px}
.card{max-width:650px;margin:30px auto;background:#fff;padding:25px;border-radius:14px;box-shadow:0 8px 25px rgba(0,0,0,.08)}
input{width:100%;box-sizing:border-box;padding:11px;margin:6px 0 12px;border:1px solid #ccc;border-radius:8px}
button{padding:11px 16px;margin:5px 4px 5px 0;border:0;border-radius:8px;background:#0d6efd;color:#fff;cursor:pointer}
button.secondary{background:#6c757d}
pre{background:#f8f9fa;padding:15px;border-radius:8px;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<div class="card">
<h2>🔐 DIGI-ARTIK SESSION TEST</h2>
<label>NIP</label>
<input id="nip" placeholder="NIP">
<label>Password</label>
<input id="password" type="password" placeholder="Password">
<button onclick="login()">🔑 LOGIN + TOKEN</button>
<button class="secondary" onclick="checkSession()">🔎 CHECK SESSION</button>
<button class="secondary" onclick="logout()">🚪 LOGOUT</button>
<pre id="hasil">Belum ada hasil...</pre>
</div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbzWA0dSkL-681hb3M2oUUvdzEKilAmdXpcusj70P03koTbqO2ZuSt_O4lkIy28NQbYB_A/exec';
let token=localStorage.getItem('DIGI_ARTIK_TOKEN')||'';

async function api(body){
 const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
 return await response.json();
}
async function login(){
 const hasil=document.getElementById('hasil');
 try{
  const data=await api({action:'login',nip:document.getElementById('nip').value.trim(),password:document.getElementById('password').value});
  if(data.success&&data.token){token=data.token;localStorage.setItem('DIGI_ARTIK_TOKEN',token);}
  hasil.textContent=JSON.stringify(data,null,2);
 }catch(e){hasil.textContent='❌ '+e.message;}
}
async function checkSession(){
 const hasil=document.getElementById('hasil');
 if(!token){hasil.textContent='⚠️ Belum ada token. Silakan LOGIN dahulu.';return;}
 try{
  const data=await api({action:'checkSession',token:token});
  hasil.textContent=JSON.stringify(data,null,2);
 }catch(e){hasil.textContent='❌ '+e.message;}
}
async function logout(){
 const hasil=document.getElementById('hasil');
 try{
  const data=await api({action:'logout',token:token});
  token='';
  localStorage.removeItem('DIGI_ARTIK_TOKEN');
  hasil.textContent=JSON.stringify(data,null,2);
 }catch(e){hasil.textContent='❌ '+e.message;}
}
</script>
</body>
</html>
